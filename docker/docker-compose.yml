services:
  # ── Application ────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: services/kb-api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: "postgresql+asyncpg://career:secret@postgres:5432/career_kb"
      MILVUS_HOST: "milvus-standalone"
      MILVUS_PORT: "19530"
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      CAREER_API_TOKEN: ${CAREER_API_TOKEN:-voltagent-service-token-dev}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      LLM_MODEL: ${LLM_MODEL:-qwen3:14b}
      WORKER_MODEL: ${WORKER_MODEL:-qwen3:14b}
    depends_on:
      postgres:
        condition: service_healthy
      milvus-standalone:
        condition: service_started
    volumes:
      - ../data:/app/data
      - ../services/kb-api/src:/app/src
      - ../services/kb-api/migrations:/app/migrations
      - ../services/kb-web:/app/services/kb-web
      - ../services/voltagent-career/hill-climbing:/app/hill-climbing
      - ../services/voltagent-career/src/agents:/app/voltagent-agents
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: career
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: career_kb
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U career"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Milvus (vector DB) ─────────────────────────
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      --advertise-client-urls=http://127.0.0.1:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2023-03-13T19-46-17Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    restart: unless-stopped

  milvus-standalone:
    image: milvusdb/milvus:v2.4.13
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: "etcd:2379"
      MINIO_ADDRESS: "minio:9000"
      # Auto-flush sealed segments to MinIO every 60s — prevents data loss on crash
      MILVUS_DATACOORD_SEGMENT_MAXLIFETIME: "60"
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped

  # ── SearXNG (web search backend) ──────────────
  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080"
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  # ── VoltAgent ──────────────────────────────────
  voltagent:
    build:
      context: ../services/voltagent-career
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3141:3141"
    environment:
      KB_API_URL: http://app:8000
      CAREER_API_TOKEN: ${CAREER_API_TOKEN:-voltagent-service-token-dev}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      VOLTAGENT_MODEL: ${VOLTAGENT_MODEL:-qwen3:14b}
      SPECIALIST_MODEL: ${SPECIALIST_MODEL:-qwen3:14b}
      FAST_MODEL: ${FAST_MODEL:-qwen3:8b}
      SEARXNG_URL: "http://searxng:8080"
      PORT: 3141
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
    volumes:
      - ../services/voltagent-career/src:/app/src:ro
    depends_on:
      app:
        condition: service_started
      searxng:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3141/agents"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # ── kb-web (Next.js) ──────────────────────────
  kb-web:
    build:
      context: ../services/kb-web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ""
      VOLTAGENT_URL: "http://voltagent:3141"
    depends_on:
      - app
    restart: unless-stopped

  # ── Nginx ──────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - kb-web
      - voltagent
    restart: unless-stopped

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
