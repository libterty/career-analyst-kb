upstream app {
    server app:8000;
}

upstream kb-web {
    server kb-web:3000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 60M;

    # Docker internal DNS — allows optional upstreams (voltagent) to be absent at startup
    resolver 127.0.0.11 valid=30s;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # /agents/ → VoltAgent (optional; resolved lazily via Docker DNS)
    location /agents/ {
        set $va "voltagent:3141";
        proxy_pass http://$va;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        # SSE — disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # /health → FastAPI kb-api
    location = /health {
        proxy_pass http://app;
        proxy_set_header Host $host;
    }

    # /api/ → FastAPI kb-api
    location /api/ {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # SSE streaming — disable buffering
    location /api/chat/query {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # / → Next.js kb-web
    location / {
        proxy_pass http://kb-web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
