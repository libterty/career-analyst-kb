upstream app {
    server app:8000;
}

# Uncomment after enabling kb-web profile:
# upstream kb-web {
#     server kb-web:3000;
# }

upstream voltagent {
    server voltagent:3141;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 60M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # /agents/ → VoltAgent (Phase F2 VoltAgent mode)
    location /agents/ {
        proxy_pass http://voltagent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    # /api/ → FastAPI kb-api
    location /api/ {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # SSE streaming — disable buffering
    location /api/chat/query {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
    }

    # / → FastAPI static (current); switch to kb-web:3000 after F6 validation
    location / {
        proxy_pass http://app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
